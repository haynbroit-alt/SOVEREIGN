[project]
name = "sovereign"
version = "0.1.0"
description = "SOVEREIGN — Autonomous Business Intelligence Director. Anticiper. Décider. Diriger. Faire grandir."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "SOVEREIGN contributors" }]
# Versions vérifiées sur PyPI le 2026-11-17 (voir docs/VEILLE_TECHNOLOGIQUE.md).
dependencies = [
    "pydantic>=2.14,<3",
    "pyyaml>=6.0.3,<7",
    "typer>=0.29,<1",
    "rich>=15,<16",
    "httpx2>=2.16,<3",
    "fastapi>=0.163,<1",
    "uvicorn>=0.54,<1",
    "mcp>=2.3,<3",
    "opentelemetry-api>=1.45,<2",
]

[project.optional-dependencies]
# Raisonnement LLM optionnel (conseil des IA enrichi). Le système fonctionne sans.
llm = ["anthropic>=2.9,<3"]
# Export des traces / métriques OpenTelemetry (OTLP HTTP).
otel = ["opentelemetry-sdk>=1.45,<2", "opentelemetry-exporter-otlp-proto-http>=1.45,<2"]
# Veille : lecture des flux RSS/Atom.
watch = ["feedparser>=6.0.14,<7"]

[project.scripts]
sovereign = "sovereign.interfaces.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "ruff>=0.17",
    "mypy>=2.4",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sovereign"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["network: test nécessitant un accès réseau réel (désactivé par défaut)"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PL"]
ignore = [
    "PLR0913", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "PLC0415",
    "RUF001", "RUF002", "RUF003",  # le français utilise des caractères typographiques
    "S311",   # random non cryptographique : uniquement pour la simulation Monte-Carlo
    "S608",   # requêtes SQL paramétrées construites depuis des listes blanches internes
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
packages = ["sovereign"]
mypy_path = "src"
